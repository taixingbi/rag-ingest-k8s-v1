# One-off ingest job. Mac mini: parallelism 1 + --mode sync keeps Ollama warm and feeds it one batch at a time (CPU inference scales with batch size, not concurrency).
# Local cluster: docker build -t rag-ingest:latest . then apply.
# Remote cluster: use your registry image and set imagePullPolicy: Always (or remove it).
# To change resources/image: kubectl delete job rag-ingest && kubectl apply -f k8s/job.yaml (Job spec.template is immutable).
# kubectl apply -f k8s/configmap.yaml -f k8s/pvc.yaml -f k8s/job.yaml  (create secret first via kubectl)
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-ingest
  labels:
    app: rag-ingest
spec:
  ttlSecondsAfterFinished: 86400  # keep finished job 24h for logs
  backoffLimit: 0
  completionMode: Indexed
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: rag-ingest
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: rag-ingest:latest
          imagePullPolicy: Never
          resources:
            limits:
              memory: "6Gi"
              cpu: "3"
            requests:
              memory: "4Gi"
              cpu: "2"

          command:
            - python
            - -u
            - main.py
            - ingest
            - --input-dir
            - /data
            - --pattern
            - "**/*"
            - --env
            - dev
            - --target
            - atlas
            - --mode
            - sync
            - --force
          env:
            - name: STATE_FILE
              value: /data/state.json
            - name: JOB_PARALLELISM
              value: "1"
            - name: JOB_COMPLETIONS
              value: "1"
          envFrom:
            - configMapRef:
                name: rag-ingest-config
            - secretRef:
                name: rag-ingest-secret
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rag-ingest-data
