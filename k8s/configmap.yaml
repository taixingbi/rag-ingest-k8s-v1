apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-ingest-config
  labels:
    app: rag-ingest
data:
  MONGODB_DB: "db_hunt"
  MONGODB_COLLECTION: "collection_taixingbi"
  CHUNK_TOKENS: "1000"
  OVERLAP_TOKENS: "150"
  CHUNK_CHARS: "5000"
  OVERLAP_CHARS: "800"
  BATCH_SIZE: "128"
  MAX_CONCURRENT_FILES: "6"
  EMBED_PROVIDER: "ollama"
  # EMBED_MODEL: "nomic-embed-text"  # optional; default for ollama
