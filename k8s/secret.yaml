# Create this Secret with your real values (do not commit real credentials).
# Example:
#   kubectl create secret generic rag-ingest-secret \
#     --from-literal=MONGODB_URI='mongodb+srv://user:pass@cluster...' \
#     --from-literal=OPENAI_API_KEY='sk-...'
# Or apply after encoding: echo -n 'your-uri' | base64
apiVersion: v1
kind: Secret
metadata:
  name: rag-ingest-secret
  labels:
    app: rag-ingest
type: Opaque
stringData:
  # Replace with your Atlas URI and OpenAI key (or use kubectl create secret and remove stringData)
  MONGODB_URI: ""
  OPENAI_API_KEY: ""
